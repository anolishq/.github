# External link check for the published docs (weekly, external-links.yml).
# Code blocks are not checked (include_verbatim stays off): they hold
# 127.0.0.1/localhost URLs and release-download templates.

exclude_loopback = true
exclude_private = true
exclude = [
  '^https?://host[:/]',                  # placeholder host in command examples
  '^https?://api\.github\.com/',         # API calls, not pages
  '/releases/download/v\$',              # templated download URLs
  'vX\.Y\.Z',                            # version placeholders
  '^https?://anolishq\.github\.io/',     # the site build checks its own links
]
accept = ["200..=299", "429"]
max_retries = 3
retry_wait_time = 5
timeout = 30
cache = true
max_cache_age = "1d"
