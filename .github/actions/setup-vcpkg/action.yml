name: Setup vcpkg
description: >
  Clone and bootstrap vcpkg, with a binary cache in the org's Cloudflare R2
  bucket: vcpkg's x-aws provider, one archive per package named by vcpkg's ABI
  hash. A push or workflow_dispatch on the default branch, or a schedule, reads
  and writes with the write token; every other run reads with the read token;
  a run with no token (a fork pull request) builds without the remote cache.

  By default the vcpkg tool commit is derived from the consuming repo's
  vcpkg-configuration.json `default-registry.baseline`, so the tool commit
  and the port baseline are always the same value and cannot drift. Pass
  `vcpkg-commit` explicitly only to override that (e.g. to pin the tool to a
  commit different from the port baseline).

inputs:
  vcpkg-commit:
    description: >
      vcpkg Git commit SHA to checkout. Optional: when empty (the default),
      it is read from `vcpkg-config`'s default-registry.baseline.
    required: false
    default: ""
  vcpkg-config:
    description: "Path to vcpkg-configuration.json used to derive the commit when vcpkg-commit is empty."
    required: false
    default: "vcpkg-configuration.json"
  r2-endpoint:
    description: "R2 S3 endpoint, https://<account>.r2.cloudflarestorage.com. Pass vars.VCPKG_R2_ENDPOINT."
    required: false
    default: ""
  r2-bucket:
    description: "R2 bucket. Pass vars.VCPKG_R2_BUCKET."
    required: false
    default: ""
  r2-read-access-key-id:
    description: "Read token's access key id. Pass secrets.VCPKG_R2_READ_ACCESS_KEY_ID."
    required: false
    default: ""
  r2-read-secret-access-key:
    description: "Read token's secret. Pass secrets.VCPKG_R2_READ_SECRET_ACCESS_KEY."
    required: false
    default: ""
  r2-write-access-key-id:
    description: >
      Write token's access key id. Pass secrets.VCPKG_R2_WRITE_ACCESS_KEY_ID.
      Used only on a push or workflow_dispatch on the default branch, or a schedule.
    required: false
    default: ""
  r2-write-secret-access-key:
    description: "Write token's secret. Pass secrets.VCPKG_R2_WRITE_SECRET_ACCESS_KEY."
    required: false
    default: ""
  triplet:
    description: "Deprecated and ignored since v3: the cache is keyed by vcpkg's ABI hash. Accepted for one release."
    required: false
    default: ""
  cache-write:
    description: "Deprecated and ignored since v3: the event decides whether a run writes. Accepted for one release."
    required: false
    default: ""
  token:
    description: "GitHub token (reserved for future NuGet integration)"
    required: false
    default: ${{ github.token }}

outputs:
  binary-cache-mode:
    description: "readwrite, read or none: what this run does with the R2 binary cache."
    value: ${{ steps.cache.outputs.mode }}

runs:
  using: composite
  steps:
    - name: Warn about deprecated inputs
      if: inputs.triplet != '' || inputs.cache-write != ''
      shell: bash
      run: |
        echo "::warning title=setup-vcpkg v3::'triplet' and 'cache-write' are ignored since v3 and will be removed; drop them from this step."

    - name: Resolve vcpkg commit
      id: resolve
      shell: bash
      run: |
        set -euo pipefail
        commit="${{ inputs.vcpkg-commit }}"
        if [[ -n "$commit" ]]; then
          echo "Using explicit vcpkg-commit input: $commit"
        else
          cfg="${{ inputs.vcpkg-config }}"
          # The caller may check the repo out under a `path:` subdirectory, so the
          # config is not necessarily at the workspace root. If the configured path
          # does not exist, discover it under the workspace. The vcpkg clone does not exist yet at
          # this point, but exclude its path defensively.
          if [[ ! -f "$cfg" ]]; then
            cfg="$(find "${{ github.workspace }}" -maxdepth 4 -name vcpkg-configuration.json -not -path '*/vcpkg/*' 2>/dev/null | sort | head -1)"
          fi
          if [[ -z "$cfg" || ! -f "$cfg" ]]; then
            echo "::error::vcpkg-commit not provided and no vcpkg-configuration.json found under ${{ github.workspace }}"
            exit 1
          fi
          commit="$(jq -r '."default-registry".baseline // empty' "$cfg")"
          echo "Derived vcpkg commit from $cfg: $commit"
        fi
        if [[ -z "$commit" || "$commit" == "null" ]]; then
          echo "::error::could not resolve a vcpkg commit (input empty and baseline missing/invalid)"
          exit 1
        fi
        echo "commit=$commit" >> "$GITHUB_OUTPUT"

    - name: Clone vcpkg
      shell: bash
      run: |
        set -euo pipefail
        VCPKG_DIR="${{ github.workspace }}/vcpkg"
        if [[ ! -d "$VCPKG_DIR/.git" ]]; then
          git clone https://github.com/microsoft/vcpkg.git "$VCPKG_DIR" --filter=blob:none --no-checkout
        fi
        cd "$VCPKG_DIR"
        git fetch origin "${{ steps.resolve.outputs.commit }}" --depth=1
        git checkout "${{ steps.resolve.outputs.commit }}"

    - name: Bootstrap vcpkg (Linux/macOS)
      if: runner.os != 'Windows'
      shell: bash
      run: |
        set -euo pipefail
        "${{ github.workspace }}/vcpkg/bootstrap-vcpkg.sh" -disableMetrics

    - name: Bootstrap vcpkg (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        & "${{ github.workspace }}\vcpkg\bootstrap-vcpkg.bat" -disableMetrics

    - name: Configure environment
      shell: bash
      run: echo "VCPKG_ROOT=${{ github.workspace }}/vcpkg" >> "$GITHUB_ENV"

    - name: Configure the binary cache
      id: cache
      shell: bash
      env:
        EVENT: ${{ github.event_name }}
        REF: ${{ github.ref }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        ENDPOINT: ${{ inputs.r2-endpoint }}
        BUCKET: ${{ inputs.r2-bucket }}
        READ_ID: ${{ inputs.r2-read-access-key-id }}
        READ_SECRET: ${{ inputs.r2-read-secret-access-key }}
        WRITE_ID: ${{ inputs.r2-write-access-key-id }}
        WRITE_SECRET: ${{ inputs.r2-write-secret-access-key }}
      run: bash "${{ github.action_path }}/binary-source.sh"
