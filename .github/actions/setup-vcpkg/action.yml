name: Setup vcpkg
description: >
  Clone and bootstrap vcpkg with working binary caching via actions/cache.
  Replaces lukka/run-vcpkg whose x-gha binary cache provider was removed
  from vcpkg in April 2025.

  By default the vcpkg tool commit is derived from the consuming repo's
  vcpkg-configuration.json `default-registry.baseline`, so the tool commit
  and the port baseline are always the same value and cannot drift. Pass
  `vcpkg-commit` explicitly only to override that (e.g. to pin the tool to a
  commit different from the port baseline).

inputs:
  vcpkg-commit:
    description: >
      vcpkg Git commit SHA to checkout. Optional: when empty (the default),
      it is read from `vcpkg-config`'s default-registry.baseline.
    required: false
    default: ""
  vcpkg-config:
    description: "Path to vcpkg-configuration.json used to derive the commit when vcpkg-commit is empty."
    required: false
    default: "vcpkg-configuration.json"
  triplet:
    description: "Target triplet (used in cache key for partition isolation)"
    required: true
  token:
    description: "GitHub token (reserved for future NuGet integration)"
    required: false
    default: ${{ github.token }}
  cache-write:
    description: >
      Whether this job may WRITE (save) the vcpkg binary cache. Default "true".
      Set "false" for a build variant whose dependency closure is a SUBSET of
      another variant that shares the same cache key (same os/arch/triplet/
      baseline/manifest) — e.g. a FluxGraph-OFF build alongside a FluxGraph-ON
      build. A read-only job restores the superset cache but never saves, so the
      faster subset job cannot clobber the superset cache under the shared key
      (which would otherwise drop the expensive packages and force rebuilds).
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Resolve vcpkg commit
      id: resolve
      shell: bash
      run: |
        set -euo pipefail
        commit="${{ inputs.vcpkg-commit }}"
        if [[ -n "$commit" ]]; then
          echo "Using explicit vcpkg-commit input: $commit"
        else
          cfg="${{ inputs.vcpkg-config }}"
          # The caller may check the repo out under a `path:` subdirectory, so the
          # config is not necessarily at the workspace root. If the configured path
          # does not exist, discover it under the workspace (mirrors the cache key's
          # `**/vcpkg-configuration.json` glob). The vcpkg clone does not exist yet at
          # this point, but exclude its path defensively.
          if [[ ! -f "$cfg" ]]; then
            cfg="$(find "${{ github.workspace }}" -maxdepth 4 -name vcpkg-configuration.json -not -path '*/vcpkg/*' 2>/dev/null | sort | head -1)"
          fi
          if [[ -z "$cfg" || ! -f "$cfg" ]]; then
            echo "::error::vcpkg-commit not provided and no vcpkg-configuration.json found under ${{ github.workspace }}"
            exit 1
          fi
          commit="$(jq -r '."default-registry".baseline // empty' "$cfg")"
          echo "Derived vcpkg commit from $cfg: $commit"
        fi
        if [[ -z "$commit" || "$commit" == "null" ]]; then
          echo "::error::could not resolve a vcpkg commit (input empty and baseline missing/invalid)"
          exit 1
        fi
        echo "commit=$commit" >> "$GITHUB_OUTPUT"

    - name: Resolve runner image version
      id: img
      shell: bash
      run: |
        set -euo pipefail
        # $ImageVersion is exported into every GitHub-hosted runner's process
        # environment, but it is NOT exposed through the `${{ env.* }}` expression
        # context (which only holds workflow/job/step-defined vars). A `run:` step
        # is the only place it can be read — hence this output. It changes whenever
        # GitHub rotates the runner image (and with it the MSVC/gcc toolchain), so
        # feeding it into the binary-cache key rotates the key on ABI-affecting
        # compiler bumps. See the cache-key comment below.
        echo "Resolved runner image version: ${ImageVersion:-unknown} (ImageOS=${ImageOS:-unknown})"
        echo "version=${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"

    - name: Resolve vcpkg manifest input hash
      id: inputs
      shell: bash
      run: |
        set -euo pipefail
        # Hash ONLY this consumer's vcpkg manifest inputs, anchored to the dir
        # holding its vcpkg-configuration.json. The old key used
        # hashFiles('**/vcpkg.json', '**/vcpkg-configuration.json', '**/triplets/**'),
        # whose `**/` globs span the WHOLE workspace — so a job that checks out an
        # unrelated repo into a subdir (e.g. provider-sim's FluxGraph-ON lane checks
        # out fluxgraph into ./fluxgraph) folds that repo's files into the key. The
        # ON/OFF variants then compute different keys and the cache-write subset
        # protection silently disengages (anolishq/.github#97). A workspace-rooted
        # glob cannot exclude a nested checkout, so hash an explicit file set.
        cfg="${{ inputs.vcpkg-config }}"
        if [[ ! -f "$cfg" ]]; then
          cfg="$(find "${{ github.workspace }}" -maxdepth 4 -name vcpkg-configuration.json -not -path '*/vcpkg/*' 2>/dev/null | sort | head -1)"
        fi
        # NOTE: this discovery is identical to the `resolve` step above so the
        # commit and the input hash always describe the SAME repo. The find
        # fallback only fires for a `path:`-subdir checkout (every current
        # consumer keeps vcpkg-configuration.json at the workspace root, so the
        # `-f "$cfg"` test is true and the fallback is skipped). It assumes the
        # consumer's config sorts before any nested foreign config.
        if [[ -n "$cfg" && -f "$cfg" ]]; then
          root="$(cd "$(dirname "$cfg")" && pwd)"
        else
          root="${{ github.workspace }}"
        fi
        echo "Hashing vcpkg manifest inputs under: $root"
        # Explicit consumer files (NOT a workspace glob): the root manifest pair
        # plus its sibling triplets/ definitions. Relative paths + contents are
        # hashed, so the absolute checkout dir does not affect the digest.
        list="$(mktemp)"
        for f in vcpkg.json vcpkg-configuration.json; do
          [[ -f "$root/$f" ]] && echo "$f" >> "$list"
        done
        if [[ -d "$root/triplets" ]]; then
          (cd "$root" && find triplets -type f) >> "$list"
        fi
        LC_ALL=C sort -o "$list" "$list"  # locale-stable ordering
        echo "Files folded into the cache key:"; sed 's/^/  /' "$list"
        digest="$(while IFS= read -r rel; do
          printf '%s\0' "$rel"
          sha256sum "$root/$rel" | awk '{print $1}'
        done < "$list" | sha256sum | awk '{print $1}')"
        echo "Resolved vcpkg inputs hash: $digest"
        echo "inputs_hash=$digest" >> "$GITHUB_OUTPUT"

    - name: Prepare binary cache directory
      shell: bash
      run: mkdir -p "${{ github.workspace }}/.vcpkg-binary-cache"

    # The key embeds the runner image version (`img<version>`) because vcpkg's
    # per-package ABI hash includes the compiler hash. When GitHub bumps the
    # runner image (and with it MSVC/gcc), the old binary archives become ABI
    # mismatches ("Restored 0 packages") and vcpkg rebuilds from source. Without
    # the image in the key, the manifest-hash key still hits exactly, so
    # actions/cache skips the post-save and the rebuilt archives are never
    # persisted — making the rebuild permanent (observed: anolis Windows ~34min,
    # provider-sim Windows+FluxGraph ~2h every run after an MSVC bump).
    # The image version comes from steps.img above. Do NOT revert it to
    # `${{ env.ImageVersion }}`: the env.* context excludes runner process vars,
    # so it expands to empty and the key stops rotating. On self-hosted runners
    # $ImageVersion is unset and resolves to `imgunknown` — fine, a self-managed
    # toolchain is stable and needs no ABI rotation.
    # Writer jobs (cache-write=true, default) restore AND save the cache.
    - name: Restore + save vcpkg binary cache (writer)
      if: inputs.cache-write == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ${{ github.workspace }}/.vcpkg-binary-cache
        key: vcpkg-bin-${{ runner.os }}-${{ runner.arch }}-${{ inputs.triplet }}-${{ steps.resolve.outputs.commit }}-img${{ steps.img.outputs.version }}-${{ steps.inputs.outputs.inputs_hash }}
        restore-keys: |
          vcpkg-bin-${{ runner.os }}-${{ runner.arch }}-${{ inputs.triplet }}-${{ steps.resolve.outputs.commit }}-img${{ steps.img.outputs.version }}-
          vcpkg-bin-${{ runner.os }}-${{ runner.arch }}-${{ inputs.triplet }}-${{ steps.resolve.outputs.commit }}-
          vcpkg-bin-${{ runner.os }}-${{ runner.arch }}-${{ inputs.triplet }}-

    # Reader jobs (cache-write=false) restore only — no post-save — so a subset
    # build cannot overwrite the shared key with an incomplete cache.
    - name: Restore vcpkg binary cache (read-only)
      if: inputs.cache-write != 'true'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ${{ github.workspace }}/.vcpkg-binary-cache
        key: vcpkg-bin-${{ runner.os }}-${{ runner.arch }}-${{ inputs.triplet }}-${{ steps.resolve.outputs.commit }}-img${{ steps.img.outputs.version }}-${{ steps.inputs.outputs.inputs_hash }}
        restore-keys: |
          vcpkg-bin-${{ runner.os }}-${{ runner.arch }}-${{ inputs.triplet }}-${{ steps.resolve.outputs.commit }}-img${{ steps.img.outputs.version }}-
          vcpkg-bin-${{ runner.os }}-${{ runner.arch }}-${{ inputs.triplet }}-${{ steps.resolve.outputs.commit }}-
          vcpkg-bin-${{ runner.os }}-${{ runner.arch }}-${{ inputs.triplet }}-

    - name: Clone vcpkg
      shell: bash
      run: |
        set -euo pipefail
        VCPKG_DIR="${{ github.workspace }}/vcpkg"
        if [[ ! -d "$VCPKG_DIR/.git" ]]; then
          git clone https://github.com/microsoft/vcpkg.git "$VCPKG_DIR" --filter=blob:none --no-checkout
        fi
        cd "$VCPKG_DIR"
        git fetch origin "${{ steps.resolve.outputs.commit }}" --depth=1
        git checkout "${{ steps.resolve.outputs.commit }}"

    - name: Bootstrap vcpkg (Linux/macOS)
      if: runner.os != 'Windows'
      shell: bash
      run: |
        set -euo pipefail
        "${{ github.workspace }}/vcpkg/bootstrap-vcpkg.sh" -disableMetrics

    - name: Bootstrap vcpkg (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        & "${{ github.workspace }}\vcpkg\bootstrap-vcpkg.bat" -disableMetrics

    - name: Configure environment
      shell: bash
      run: |
        set -euo pipefail
        echo "VCPKG_ROOT=${{ github.workspace }}/vcpkg" >> "$GITHUB_ENV"
        mode="read"
        if [[ "${{ inputs.cache-write }}" == "true" ]]; then mode="readwrite"; fi
        echo "VCPKG_BINARY_SOURCES=clear;files,${{ github.workspace }}/.vcpkg-binary-cache,$mode" >> "$GITHUB_ENV"
