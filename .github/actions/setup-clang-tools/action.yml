name: Setup clang-tools (pinned)
description: >
  Install a pinned, SHA-512-verified clang-format (and optionally clang-tidy)
  static binary on PATH — the org's single source of truth for C++ formatting.

  This replaces apt / pip / pre-commit delivery of clang-format, all of which
  drift by distro or version (Debian trixie `clang-format-18` is 18.1.8 but
  Ubuntu noble's is 18.1.3, and they format differently). The binary here is a
  statically-linked LLVM 18.1.8 build from
  muttleyxd/clang-tools-static-binaries, pinned by release tag AND SHA-512 so
  every CI runner and dev box runs byte-identical bits (and therefore identical
  formatting). Keep this version in lockstep with
  workstation-configs `apps/clang-tools` so dev and CI match.

inputs:
  tidy:
    description: "Also install clang-tidy 18.1.8 (default: false)."
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Install pinned clang-tools
      shell: bash
      run: |
        set -euo pipefail

        REPO="muttleyxd/clang-tools-static-binaries"
        TAG="master-796e77c"   # statically-linked LLVM 18.1.8
        CF_SHA512="dcd2e4bb89e67652ceeb0fee6f431cb39d46a55025e0008ded26191ff5c0987ad4a598e2361d6b85aa54d1fab653f4e69c039e561c273ffc2183d3e5ae7c5d76"
        CT_SHA512="5980e9762e8950a66981fd522b29cdc5afc38954a7e505225a8052824f71a2d9954b627a9e5abfa8b0e94a2d51b2bb4dceaa31503f15ba89b767455106ca0d37"

        if [ "$(uname -s)-$(uname -m)" != "Linux-x86_64" ]; then
          echo "::error::setup-clang-tools supports linux-amd64 runners only (the C++ format/lint gates run there)." >&2
          exit 1
        fi

        dest="${HOME}/.local/clang-tools"
        mkdir -p "${dest}"

        fetch() {  # name  expected-sha512
          local name="$1" sha="$2"
          curl -fsSL --retry 3 --retry-delay 2 -o "${dest}/${name}" \
            "https://github.com/${REPO}/releases/download/${TAG}/${name}_linux-amd64"
          echo "${sha}  ${dest}/${name}" | sha512sum -c -
          chmod +x "${dest}/${name}"
        }

        fetch clang-format-18 "${CF_SHA512}"
        ln -sf "${dest}/clang-format-18" "${dest}/clang-format"

        if [ "${{ inputs.tidy }}" = "true" ]; then
          fetch clang-tidy-18 "${CT_SHA512}"
          ln -sf "${dest}/clang-tidy-18" "${dest}/clang-tidy"
        fi

        echo "${dest}" >> "${GITHUB_PATH}"
        "${dest}/clang-format" --version
