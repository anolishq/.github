name: ADPP Compatibility Matrix

# Org-level, scheduled, NON-GATING compatibility matrix (anolis-protocol#28).
#
# Crosses released anolis-protocol conformance-harness versions with released
# provider versions and runs the conformance harness for each pair, to surface
# cross-version drift that no single repo's PR CI can see (a provider lane only
# checks its own commit against one pinned harness). Report-only: results go to
# the job summary + an artifact; the workflow never fails on a conformance
# result. It must never gate a protocol or provider PR.
#
# The eligible cell set is discovered at run time (scripts/adpp_compat_*.sh), so
# this self-activates as new released versions land — no edits needed per release.

on:
  schedule:
    - cron: "0 5 * * 0" # Sundays 05:00 UTC (clear of the Mon 06/07/09 org scans)
  workflow_dispatch:

permissions:
  contents: write # publish the verdict to the adpp-compat-data branch

concurrency:
  group: adpp-compat-matrix
  cancel-in-progress: false

jobs:
  matrix:
    name: Released protocol × released provider
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Enumerate eligible (protocol × provider) cells
        id: enum
        run: |
          scripts/adpp_compat_enumerate.sh > cells.json
          count="$(jq 'length' cells.json)"
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "Discovered $count cell(s):"
          jq -c '.[]' cells.json || true

      - name: Run conformance harness for each cell
        if: steps.enum.outputs.count != '0'
        run: scripts/adpp_compat_run.sh cells.json results.json

      - name: Write job summary
        if: always()
        run: |
          if [ -f results.json ]; then
            scripts/adpp_compat_summary.sh results.json >> "$GITHUB_STEP_SUMMARY"
          else
            scripts/adpp_compat_summary.sh /dev/null >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: adpp-compat-matrix
          path: |
            cells.json
            results.json
          if-no-files-found: ignore
          retention-days: 90

      # Durable publish (anolishq/.github#101): the artifact above is ephemeral
      # (90-day retention) and unauthenticated consumers cannot fetch it. Mirror
      # results.json + a trimmed latest.json onto the dedicated `adpp-compat-data`
      # branch so anolis-workbench#137 can read a stable verdict via raw URL/gh api.
      # A data branch (not main) avoids main's branch protection and PR noise.
      - name: Publish verdict to adpp-compat-data branch
        if: always()
        run: |
          set -euo pipefail
          if [ ! -f results.json ]; then
            echo "no results.json (zero cells or harness skipped); nothing to publish"
            exit 0
          fi
          gen="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # Trimmed, consumer-facing verdict. Keeps 0F's native identity
          # (provider = repo name, version = v-prefixed tag); the consumer
          # reconciles to its own key format. status ∈ pass|fail|error.
          jq --arg gen "$gen" \
            '{schema: 1, generated_at: $gen,
              pairs: [ .[] | {protocol, provider, version, status, summary} ]}' \
            results.json > latest.json
          echo "latest.json:"; jq -c '{schema, generated_at, count: (.pairs|length)}' latest.json

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          wt="$(mktemp -d)"
          if git ls-remote --exit-code --heads origin adpp-compat-data >/dev/null 2>&1; then
            git fetch --depth=1 origin adpp-compat-data
            git worktree add "$wt" FETCH_HEAD
            git -C "$wt" switch -C adpp-compat-data
          else
            git worktree add --detach "$wt" HEAD
            git -C "$wt" checkout --orphan adpp-compat-data
            git -C "$wt" rm -rf . >/dev/null 2>&1 || true
          fi
          mkdir -p "$wt/data/adpp-compat"
          cp results.json latest.json "$wt/data/adpp-compat/"
          git -C "$wt" add data/adpp-compat
          if git -C "$wt" diff --cached --quiet; then
            echo "verdict unchanged; nothing to publish"
          else
            git -C "$wt" commit -m "chore(adpp-compat): publish verdict ($gen)"
            git -C "$wt" push origin adpp-compat-data
            echo "published to adpp-compat-data:data/adpp-compat/{results,latest}.json"
          fi
