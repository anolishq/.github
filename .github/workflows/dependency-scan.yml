name: Dependency Scan

# Reusable CVE scan for the org's vcpkg-based C/C++ repositories.
#
# vcpkg pins dependency versions via the registry baseline (not in vcpkg.json),
# and its generated SPDX SBOMs carry no CPE/purl identifiers, so generic SBOM
# scanners (OSV-Scanner/Trivy/Grype) cannot match CVEs against them. Instead we
# install the resolved dependency set and scan the *compiled* libraries with
# cve-bin-tool, which fingerprints binaries and maps components to known CVEs.
#
# Non-blocking by design: the scan never fails the workflow. Findings surface as
# a job summary plus an uploaded HTML/JSON report artifact. Intended to be
# called on a schedule (and manual dispatch), not as a PR gate.

on:
  workflow_call:
    inputs:
      triplet:
        description: "vcpkg triplet to install and scan. Matches the repos' CI triplet so the warm binary cache is reused."
        required: false
        default: "x64-linux-static"
        type: string
      overlay-triplets:
        description: "Directory of overlay triplet definitions (relative to manifest-dir). Most repos define the custom x64-linux-static triplet under triplets/. Passed to vcpkg only when the directory exists."
        required: false
        default: "triplets"
        type: string
      features:
        description: "Semicolon-separated manifest features to enable (e.g. 'server;json;yaml;tests'). Needed when deps are feature-gated (fluxgraph); leave empty for repos with top-level dependencies."
        required: false
        default: ""
        type: string
      manifest-dir:
        description: "Directory containing vcpkg.json (relative to the repo root)."
        required: false
        default: "."
        type: string
      cve-bin-tool-ref:
        description: "Git ref/SHA of ossf/cve-bin-tool to install. Pinned to a main commit because the keyless NVD 2.0 mirror feed is not in any release yet (3.4 uses the retired, empty 1.1 feed)."
        required: false
        default: "182267f4b8a149612aa92caf26c44e08f50bdb0e"
        type: string
      cache-write:
        description: >
          Whether this job saves the vcpkg binary cache: "true", or "false" (the
          default) to restore it only. setup-vcpkg's cache key is made of the
          os, arch, `triplet` input, compiler hash, vcpkg baseline, runner image
          and a hash of vcpkg.json, vcpkg-configuration.json and triplets/, so
          at one commit every job in the caller on the same runner image with
          the same triplet and compiler shares it, and the first job to save it
          keeps it. This job installs the manifest with `features`,
          which need not match what the caller's CI builds; if it saved a
          smaller set first, the caller's CI could not save, and later jobs
          would build the rest from source. Pass "true" only when no other job
          in the caller saves this key.
        required: false
        default: "false"
        type: string

permissions:
  contents: read

jobs:
  scan:
    name: vcpkg CVE scan
    runs-on: ubuntu-26.04
    # Cold cache builds the dependency set from source (grpc/protobuf/openssl);
    # warm cache (shared with CI's triplet) is fast.
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build g++ pkg-config

      - name: Maximize swap space
        # cve-bin-tool's CVE-database build is memory-heavy and was OOM-killing
        # the standard runner mid-build (job reclaimed). Give the kernel headroom
        # via a large swapfile on the roomy /mnt disk. Best-effort: never blocks.
        continue-on-error: true
        run: |
          sudo swapoff -a || true
          sudo rm -f /swapfile /mnt/swapfile || true
          sudo fallocate -l 10G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"

      - name: Setup vcpkg
        uses: anolishq/.github/.github/actions/setup-vcpkg@721e8a07128cd274efe6a17e0a51c0a9b1caf6b9 # v2.9
        with:
          triplet: ${{ inputs.triplet }}
          cache-write: ${{ inputs.cache-write }}

      - name: Install vcpkg dependencies
        working-directory: ${{ inputs.manifest-dir }}
        env:
          TRIPLET: ${{ inputs.triplet }}
          OVERLAY_DIR: ${{ inputs.overlay-triplets }}
          FEATURES: ${{ inputs.features }}
        run: |
          set -euo pipefail
          args=(install --triplet "$TRIPLET" --x-install-root="$PWD/vcpkg_installed")
          # The custom x64-linux-static triplet is an overlay, not a built-in;
          # point vcpkg at it when present (matches CI, so the cache is reused).
          if [ -n "$OVERLAY_DIR" ] && [ -d "$OVERLAY_DIR" ]; then
            args+=(--overlay-triplets="$PWD/$OVERLAY_DIR")
          fi
          # Enable feature-gated dependencies (e.g. fluxgraph's deps live under features).
          if [ -n "$FEATURES" ]; then
            IFS=';' read -ra feats <<< "$FEATURES"
            for f in "${feats[@]}"; do
              [ -n "$f" ] && args+=(--x-feature="$f")
            done
          fi
          echo "vcpkg ${args[*]}"
          "$VCPKG_ROOT/vcpkg" "${args[@]}"

      - name: Install cve-bin-tool
        run: pip install "cve-bin-tool @ git+https://github.com/ossf/cve-bin-tool.git@${{ inputs.cve-bin-tool-ref }}"

      - name: Cache CVE database
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/cve-bin-tool
          key: cve-bin-tool-db-v3-${{ github.run_id }}
          restore-keys: |
            cve-bin-tool-db-v3-

      - name: Build dependency list from vcpkg SBOM
        id: deps
        working-directory: ${{ inputs.manifest-dir }}
        run: |
          python3 - "${{ inputs.triplet }}" <<'PY'
          import csv, glob, json, os, sys
          triplet = sys.argv[1]
          # vcpkg SPDX SBOMs carry no CPE/purl, so this small curated map bridges
          # vcpkg port names to NVD (vendor, product). cve-bin-tool's --input-file
          # then matches the resolved versions against the FULL NVD database (not
          # just products with a binary checker). Add an entry when a new
          # dependency is introduced; names verified against NVD's CPE dictionary.
          PORT_CPE = {
              "openssl":       ("openssl", "openssl"),
              "protobuf":      ("google", "protobuf"),
              "grpc":          ("grpc", "grpc"),
              "yaml-cpp":      ("yaml-cpp_project", "yaml-cpp"),
              "cpp-httplib":   ("cpp-httplib_project", "cpp-httplib"),
              "nlohmann-json": ("nlohmann", "json"),
          }
          rows, seen = [], set()
          for spdx in sorted(glob.glob(f"vcpkg_installed/{triplet}/share/*/vcpkg.spdx.json")):
              try:
                  data = json.load(open(spdx))
              except Exception:
                  continue
              port = next((p for p in data.get("packages", [])
                           if p.get("SPDXID") == "SPDXRef-port"), None)
              if not port or port.get("name") not in PORT_CPE:
                  continue
              ver = (port.get("versionInfo") or "").split("#")[0].strip()
              if not ver or ver == "NOASSERTION":
                  continue
              vendor, product = PORT_CPE[port["name"]]
              if (vendor, product, ver) in seen:
                  continue
              seen.add((vendor, product, ver))
              rows.append((vendor, product, ver))
          with open("deps.csv", "w", newline="") as f:
              w = csv.writer(f)
              w.writerow(["vendor", "product", "version"])
              w.writerows(rows)
          print(f"Mapped {len(rows)} dependency(ies) to NVD products:")
          for r in rows:
              print("  ", ",".join(r))
          with open(os.environ["GITHUB_OUTPUT"], "a") as gh:
              gh.write(f"count={len(rows)}\n")
          PY

      - name: Run CVE scan (non-blocking)
        id: scan
        working-directory: ${{ inputs.manifest-dir }}
        # Step-level cap so a stalled DB fetch fails this step cleanly (and lets
        # the summary / artifact / DB-cache-save steps still run) rather than
        # having the whole job reclaimed.
        timeout-minutes: 45
        env:
          DEP_COUNT: ${{ steps.deps.outputs.count }}
        run: |
          set +e
          # Keyless NVD via the cveb.in mirror (FCIX-backed: no API key, no rate
          # limit, refreshed several times daily). NVD's own API returns 503 to
          # GitHub-hosted runner IPs even with a key, so the mirror is the only
          # reliable source from CI. The pinned cve-bin-tool reads the live NVD
          # 2.0 feed (release 3.4 used the retired/empty 1.1 feed → no NVD data).
          # OSV/GAD/CURL/EPSS/RSD are disabled: OSV in particular pulls every
          # language ecosystem and OOM-reclaimed the runner; we match C/C++ by CPE.
          # Each run writes its report even when it finds nothing (an empty
          # list), so a missing report means the run failed or was skipped.
          common=(--nvd json-mirror --format json,html
                  --disable-data-source "OSV,GAD,CURL,EPSS,RSD")
          # Safety guard: how many CVEs the DB loaded. If implausibly low (mirror
          # outage), an empty result must NOT read as a clean bill. Empty when
          # cve-bin-tool has not reported it, which is not the same as 0.
          db_count() {
            grep -oE 'There are [0-9]+ CVE' cbt.out | grep -oE '[0-9]+' | sort -rn | head -1
          }
          # Each result goes to GITHUB_OUTPUT as soon as it is known, so a step
          # timeout during the binary scan keeps the version lookup's result.
          # 1) Version lookup of the resolved direct deps against the FULL NVD DB
          #    — covers C++ libs with no binary checker (protobuf, yaml-cpp, grpc).
          #    Runs first so it populates the cached CVE DB.
          deps_rc=0
          if [ "${DEP_COUNT:-0}" -gt 0 ]; then
            cve-bin-tool "${common[@]}" --output-file cve-deps --input-file deps.csv 2>&1 | tee cbt.out
            deps_rc=${PIPESTATUS[0]}
          else
            echo "No mapped dependencies; skipping version-based lookup." | tee cbt.out
          fi
          {
            echo "deps_rc=$deps_rc"
            echo "deps_db_count=$(db_count)"
          } >> "$GITHUB_OUTPUT"
          # 2) Binary scan of the installed tree (DB cached → cheap); catches
          #    linked/transitive libs via cve-bin-tool checkers.
          cve-bin-tool "${common[@]}" --output-file cve-binary "vcpkg_installed/${{ inputs.triplet }}" 2>&1 | tee -a cbt.out
          bin_rc=${PIPESTATUS[0]}
          echo "version-lookup exit=$deps_rc  binary-scan exit=$bin_rc  db_cve_count=$(db_count)"
          {
            echo "bin_rc=$bin_rc"
            echo "db_count=$(db_count)"
          } >> "$GITHUB_OUTPUT"
          exit 0

      - name: Build job summary
        if: always()
        working-directory: ${{ inputs.manifest-dir }}
        env:
          DB_COUNT: ${{ steps.scan.outputs.db_count }}
          DEPS_DB_COUNT: ${{ steps.scan.outputs.deps_db_count }}
          DEP_COUNT: ${{ steps.deps.outputs.count }}
          DEPS_RC: ${{ steps.scan.outputs.deps_rc }}
          BIN_RC: ${{ steps.scan.outputs.bin_rc }}
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os
          # The DB normally holds ~300k+ CVEs once the NVD mirror loads. A low
          # count means the mirror didn't populate, so an empty result is not a
          # clean bill of health. DB_COUNT is missing when the step stopped
          # during the binary scan; the version lookup's count stands in. With
          # neither, the size is unknown, which is not a clean bill either.
          count = os.environ.get("DB_COUNT") or os.environ.get("DEPS_DB_COUNT") or ""
          db_count = int(count) if count else None
          nvd_ok = db_count is not None and db_count >= 100000
          UNREADABLE = object()
          def load(path):
              if not os.path.exists(path):
                  return None
              try:
                  d = json.load(open(path))
              except Exception:
                  return UNREADABLE
              if isinstance(d, list):
                  return d
              if isinstance(d, dict) and isinstance(d.get("report"), list):
                  return d["report"]
              return UNREADABLE
          def table(rows):
              out = ["| Product | Version | CVE | Severity | Score |",
                     "| --- | --- | --- | --- | --- |"]
              for r in rows[:100]:
                  out.append(f"| {r.get('product','')} | {r.get('version','')} | "
                             f"{r.get('cve_number','')} | {r.get('severity','')} | "
                             f"{r.get('score','')} |")
              if len(rows) > 100:
                  out.append(f"\n…and {len(rows) - 100} more — see the report artifact.")
              return "\n".join(out)
          print("## vcpkg dependency CVE scan\n")
          if db_count is None:
              why = ("cve-bin-tool did not report how many CVEs it loaded"
                     if os.environ.get("BIN_RC") else
                     "the scan step did not finish (skipped, timed out or cancelled)")
              print("> [!WARNING]\n"
                    f"> **The CVE database size is unknown: {why} — CVE coverage "
                    "is INCOMPLETE.**\n"
                    "> An empty result below does **not** mean the dependencies "
                    "are free of known CVEs. See the step log.\n")
          elif not nvd_ok:
              # NVD mirror didn't populate -> an empty result is NOT a clean bill.
              print("> [!WARNING]\n"
                    f"> **The NVD dataset did not load (DB held only {db_count} "
                    "CVEs) — CVE coverage is INCOMPLETE.**\n"
                    "> An empty result below does **not** mean the dependencies "
                    "are free of known CVEs; the NVD mirror likely failed. "
                    "Re-run, or see the dependency-scanning docs in "
                    "`anolishq/.github`.\n")
          else:
              print(f"_NVD database loaded: {db_count:,} CVEs._\n")
          # cve-bin-tool writes its report and then exits 0 (no CVEs) or 1 (some).
          # 1 also covers an uncaught exception, and other statuses are failures,
          # so a missing report with any status means the run failed.
          for title, path, rc in [
              ("Direct dependencies (resolved version → NVD)", "cve-deps.json",
               os.environ.get("DEPS_RC", "")),
              ("Binary scan (linked / transitive libraries)", "cve-binary.json",
               os.environ.get("BIN_RC", "")),
          ]:
              print(f"### {title}\n")
              rows = load(path)
              if rows is None:
                  if path == "cve-deps.json" and os.environ.get("DEP_COUNT") == "0":
                      print("_Skipped: no dependency is mapped to an NVD product._\n")
                  elif rc:
                      print(f"❌ No report produced: cve-bin-tool exited {rc} (see step log).\n")
                  else:
                      print("❌ No report produced: the scan step did not finish "
                            "(skipped, timed out or cancelled; see step log).\n")
                  continue
              if rows is UNREADABLE:
                  print(f"❌ Report unreadable: {path} is not a cve-bin-tool JSON report "
                        "(see the report artifact).\n")
                  continue
              if not rows:
                  print(("✅ No known CVEs detected.\n" if nvd_ok
                         else "_No CVEs reported — but NVD did not load (see warning above)._\n"))
                  continue
              by_sev = {}
              for r in rows:
                  s = r.get("severity", "UNKNOWN")
                  by_sev[s] = by_sev.get(s, 0) + 1
              print(f"⚠️ **{len(rows)} finding(s)** — "
                    + ", ".join(f"{k}: {v}" for k, v in sorted(by_sev.items())) + "\n")
              print(table(rows) + "\n")
          PY

      - name: Upload CVE report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: cve-report-${{ inputs.triplet }}
          path: |
            ${{ inputs.manifest-dir }}/cve-deps.json
            ${{ inputs.manifest-dir }}/cve-deps.html
            ${{ inputs.manifest-dir }}/cve-binary.json
            ${{ inputs.manifest-dir }}/cve-binary.html
            ${{ inputs.manifest-dir }}/deps.csv
          if-no-files-found: warn
