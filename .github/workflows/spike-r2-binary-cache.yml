name: Spike R2 binary cache

# #175, part of #174. Runs only on this spike branch; nothing merges.
# Round 2: run 45049006120 had one large upload (grpc_x64-linux.zip) fail with
# InvalidPart on CompleteMultipartUpload while another of similar size worked.
# This uploads a 600 MB file ten times with the AWS CLI's default checksums and
# ten times with when_required, to tell a flake from a setting.
on:
  push:
    branches: [spike/r2-binary-cache]
    paths: [.github/workflows/spike-r2-binary-cache.yml]

permissions:
  contents: read

env:
  AWS_ENDPOINT_URL_S3: ${{ vars.VCPKG_R2_ENDPOINT }}
  AWS_DEFAULT_REGION: auto
  AWS_ACCESS_KEY_ID: ${{ secrets.VCPKG_R2_WRITE_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.VCPKG_R2_WRITE_SECRET_ACCESS_KEY }}
  PREFIX: s3://${{ vars.VCPKG_R2_BUCKET }}/spike/${{ github.run_id }}

jobs:
  multipart:
    name: multipart uploads (${{ matrix.mode }})
    strategy:
      fail-fast: false
      matrix:
        mode: [default, when_required]
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - name: Upload a 600 MB file ten times, then download it
        run: |
          aws --version
          if [[ "${{ matrix.mode }}" == when_required ]]; then
            export AWS_REQUEST_CHECKSUM_CALCULATION=when_required
            export AWS_RESPONSE_CHECKSUM_VALIDATION=when_required
          fi
          head -c 600M /dev/urandom > "$RUNNER_TEMP/big.bin"
          ok=0 failed=0
          for i in $(seq 1 10); do
            start=$(date +%s)
            if aws s3 cp --only-show-errors "$RUNNER_TEMP/big.bin" "$PREFIX/${{ matrix.mode }}/big-$i.bin" 2> "$RUNNER_TEMP/err.txt"; then
              ok=$((ok + 1)); echo "upload $i: ok in $(( $(date +%s) - start )) s"
            else
              failed=$((failed + 1)); echo "upload $i: FAILED in $(( $(date +%s) - start )) s: $(cat "$RUNNER_TEMP/err.txt")"
            fi
          done
          start=$(date +%s)
          aws s3 cp --only-show-errors "$PREFIX/${{ matrix.mode }}/big-1.bin" "$RUNNER_TEMP/back.bin" \
            && echo "download: $(( $(date +%s) - start )) s, identical: $(cmp -s "$RUNNER_TEMP/big.bin" "$RUNNER_TEMP/back.bin" && echo yes || echo no)"
          echo "### ${{ matrix.mode }}: $ok of 10 uploads worked, $failed failed" | tee -a "$GITHUB_STEP_SUMMARY"

  cleanup:
    name: Delete the spike's objects
    needs: [multipart]
    if: always()
    runs-on: ubuntu-26.04
    env:
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
    steps:
      - name: Delete spike/${{ github.run_id }}/
        run: |
          aws s3 rm --recursive --only-show-errors "$PREFIX/"
          left=$(aws s3 ls --recursive "$PREFIX/" | wc -l)
          echo "objects left under the run's prefix: $left"
          # A failed multipart upload leaves its parts behind, invisible to
          # s3 rm and ls; abort any under spike/, from this run or an earlier one.
          bucket=${{ vars.VCPKG_R2_BUCKET }}
          aws s3api list-multipart-uploads --bucket "$bucket" --prefix spike/ \
            --query 'Uploads[].[Key,UploadId]' --output text > uploads.txt || true
          echo "incomplete multipart uploads under spike/: $(grep -cv '^None$' uploads.txt || true)"
          while read -r key id; do
            [[ -n "$id" && "$key" != None ]] || continue
            aws s3api abort-multipart-upload --bucket "$bucket" --key "$key" --upload-id "$id" && echo "aborted $key"
          done < uploads.txt
          [[ "$left" == 0 ]]
