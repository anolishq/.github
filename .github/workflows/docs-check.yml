name: Docs Check

on:
  workflow_call:
    inputs:
      docs-path:
        description: "Path to docs directory"
        required: false
        default: "docs"
        type: string
      markdownlint-globs:
        description: "Globs for markdownlint"
        required: false
        default: |
          docs/**/*.md
          README.md
          CONTRIBUTING.md
        type: string
      skip-vitepress:
        description: "Skip VitePress build check"
        required: false
        default: false
        type: boolean
      skip-link-check:
        description: "Skip local dead-link check"
        required: false
        default: false
        type: boolean

jobs:
  markdown-lint:
    name: Markdown Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Ensure markdownlint config
        run: |
          if [ ! -f .markdownlint.json ]; then
            echo "No local config found, fetching org default"
            curl -sL https://raw.githubusercontent.com/anolishq/.github/v2/.markdownlint.json \
              -o .markdownlint.json
          else
            echo "Using local .markdownlint.json"
          fi

      - name: Markdown Lint
        id: lint
        continue-on-error: true
        uses: davidanson/markdownlint-cli2-action@6bf21b07787794f89a243495939cd651942aeabe # v24
        with:
          globs: ${{ inputs.markdownlint-globs }}

      - name: Generate summary
        if: always()
        run: |
          {
            echo "## Markdown Lint"
            if [ "${{ steps.lint.outcome }}" == "success" ]; then
              echo "✅ All files passed"
            else
              echo "❌ Issues found"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail if linting failed
        if: steps.lint.outcome == 'failure'
        run: exit 1

  vitepress-build:
    name: VitePress Build
    if: ${{ !inputs.skip-vitepress }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # npm (not pnpm) on purpose: this is a throwaway VitePress scaffold with no
      # lockfile, and pnpm 10+ gates dependency build scripts behind an allowlist
      # whose setting keeps getting renamed (onlyBuiltDependencies -> allowBuilds),
      # repeatedly breaking esbuild's postinstall here. npm runs build scripts by
      # default, so it is immune to pnpm version churn.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      - name: Create VitePress scaffold
        run: |
          mkdir -p .vitepress-check/docs/.vitepress
          cd .vitepress-check
          cat > package.json << 'EOF'
          {
            "private": true,
            "type": "module",
            "scripts": { "build": "vitepress build docs" },
            "devDependencies": { "vitepress": "^1.6.4" }
          }
          EOF
          cat > docs/.vitepress/config.mts << 'EOF'
          import { defineConfig } from 'vitepress'
          export default defineConfig({
            title: 'Build Check',
            ignoreDeadLinks: true,
          })
          EOF

      - name: Copy docs
        run: |
          if [ -d "${{ inputs.docs-path }}" ]; then
            cp -r ${{ inputs.docs-path }}/* .vitepress-check/docs/
          else
            echo "No docs directory found at ${{ inputs.docs-path }}, skipping"
            exit 0
          fi

      - name: Build
        working-directory: .vitepress-check
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Generate summary
        if: always()
        run: |
          {
            echo "## VitePress Build"
            echo "✅ Docs build successfully with VitePress"
          } >> "$GITHUB_STEP_SUMMARY"

  link-check:
    name: Link Check
    if: ${{ !inputs.skip-link-check }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check local links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          args: >-
            --offline
            --no-progress
            docs/**/*.md
            *.md
          fail: true
          jobSummary: true
