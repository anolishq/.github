name: Clang-Tidy (diff)

# Reusable changed-lines-only clang-tidy gate for the org's vcpkg-based C++ repos.
#
# Runs the PINNED clang-tidy (via setup-clang-tools) over ONLY the lines a PR
# changes (upstream clang-tidy-diff.py), honoring the repo's .clang-tidy. New
# findings surface as GitHub annotations on the PR diff plus a job summary.
#
# Advisory by default (blocking: false) — findings never fail the job. Flip
# blocking: true (and add the job to the repo's `ok` gate) to fail on new findings
# on changed lines, once a repo's findings are quiet. In either mode the job fails
# when there is no compile_commands.json or clang-tidy does not run cleanly.
# clang-tidy needs the protobuf-generated headers, so the job configures + builds
# first (bounded by the warm vcpkg cache).

on:
  workflow_call:
    inputs:
      triplet:
        description: "vcpkg triplet (match the repo's CI triplet so the warm cache is reused)."
        required: false
        default: "x64-linux-static"
        type: string
      configure-preset:
        description: "CMake configure preset — installs vcpkg deps + exports compile_commands.json."
        required: true
        type: string
      build-preset:
        description: "CMake build preset used to generate headers. Defaults to configure-preset."
        required: false
        default: ""
        type: string
      paths:
        description: "Space-separated git pathspecs of C/C++ sources to lint."
        required: false
        default: "*.c *.cc *.cpp *.cxx *.h *.hh *.hpp *.hxx"
        type: string
      blocking:
        description: "Fail the job when a finding lands on changed lines (default: advisory)."
        required: false
        default: false
        type: boolean
      apt-packages:
        description: "Extra apt packages to install before configuring (e.g. a preset's build deps like graphviz). Space-separated; empty by default."
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  clang-tidy-diff:
    name: clang-tidy (changed lines)
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # need the PR base for the changed-lines diff

      - name: Install build tools
        env:
          EXTRA_APT: ${{ inputs.apt-packages }}
        run: |
          sudo apt-get update
          # shellcheck disable=SC2086
          sudo apt-get install -y ninja-build g++ pkg-config $EXTRA_APT

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"

      - name: Setup vcpkg
        uses: anolishq/.github/.github/actions/setup-vcpkg@7b20551d1532b9e4f1264c9e966fa6ebbf098d75 # v2.6
        with:
          triplet: ${{ inputs.triplet }}

      - name: Setup pinned clang-tools
        uses: anolishq/.github/.github/actions/setup-clang-tools@9869a5f4bee7da9c7c1dc9bae033cd0137c4801d # setup-clang-tools
        with:
          tidy: "true"

      - name: Configure (vcpkg deps + compile_commands)
        run: cmake --preset ${{ inputs.configure-preset }}

      - name: Build (generate protobuf headers)
        run: cmake --build --preset ${{ inputs.build-preset || inputs.configure-preset }}

      - name: clang-tidy on changed lines
        env:
          BUILD_DIR: build/${{ inputs.configure-preset }}
          PATHS: ${{ inputs.paths }}
          BLOCKING: ${{ inputs.blocking }}
          BASE: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$BASE"

          # Changed-lines diff (merge-base) over C/C++ sources only.
          # shellcheck disable=SC2086
          git diff -U0 "origin/${BASE}...HEAD" -- $PATHS > pr.diff || true
          if [ ! -s pr.diff ]; then
            echo "No C/C++ changes in this PR — nothing to lint." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Without a database clang-tidy lints with no build flags, and
          # clang-tidy-diff still exits 0, so a missing one would pass the gate.
          if [ ! -s "$BUILD_DIR/compile_commands.json" ]; then
            printf '## clang-tidy (changed lines)\n❌ No compile_commands.json in %s.\n' \
              "$BUILD_DIR" >> "$GITHUB_STEP_SUMMARY"
            echo "::error::No compile_commands.json in ${BUILD_DIR}. The configure preset must keep binaryDir build/<preset> and export compile commands."
            exit 1
          fi

          # clang-tidy-diff runs the pinned clang-tidy only on the changed lines.
          # -W hides the vendored script's Python 3.12 SyntaxWarnings; its own
          # errors (a crash, a binary that cannot start) still reach tidy.err.
          tidy_rc=0
          python3 -W ignore::SyntaxWarning "$(command -v clang-tidy-diff)" \
            -p1 -path "$BUILD_DIR" \
            -clang-tidy-binary "$(command -v clang-tidy)" -j "$(nproc)" \
            < pr.diff > tidy.out 2> tidy.err || tidy_rc=$?

          # Emit GitHub annotations (inline on the PR diff). clang-tidy prints
          # absolute paths; GitHub only renders annotations inline when the path
          # is repo-relative, so strip the workspace prefix.
          awk -F: -v root="${GITHUB_WORKSPACE}/" '
            / (warning|error): / {
              file = $1
              if (index(file, root) == 1) file = substr(file, length(root) + 1)
              msg = $0
              sub(/^[^:]*:[^:]*:[^:]*: (warning|error): /, "", msg)
              gsub(/%/, "%25", msg); gsub(/\r/, "", msg)
              printf "::warning file=%s,line=%s,col=%s,title=clang-tidy::%s\n", file, $2, $3, msg
            }' tidy.out

          findings=$(grep -cE ' (warning|error): ' tidy.out || true)

          # The script exits 1 for a crash and for clang-tidy's own error:
          # diagnostics, which the count reports, and 0 when clang-tidy cannot
          # start or load the database, or when the database has no entries
          # ("Compile command not found", and the file is skipped). So check its
          # stderr, and its exit status when there is nothing to count.
          if grep -qE 'Terminated by signal|^Failed: |Error while trying to load a compilation database|Compile command not found' tidy.err \
            || { [ "$tidy_rc" -ne 0 ] && [ "$findings" -eq 0 ]; }; then
            cat tidy.err >&2
            {
              echo "## clang-tidy (changed lines)"
              echo "❌ clang-tidy did not run cleanly (exit ${tidy_rc}), so the changed lines were not checked."
              echo '```'
              sed -n '1,40p' tidy.err
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::clang-tidy did not run cleanly (exit ${tidy_rc}); see the log."
            exit 1
          fi

          {
            echo "## clang-tidy (changed lines)"
            if [ "$findings" -eq 0 ]; then
              echo "✅ No new findings on the changed lines."
            else
              echo "⚠️ **${findings} finding(s)** on changed lines — see the inline annotations."
              echo '```'
              sed -n '1,80p' tidy.out
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$BLOCKING" = "true" ] && [ "$findings" -gt 0 ]; then
            echo "::error::${findings} new clang-tidy finding(s) on changed lines."
            exit 1
          fi
