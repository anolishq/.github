name: External Links

# Org-level, scheduled, NON-GATING check of external links in each public
# repo's published docs (docs/**/*.md and README.md on the default branch).
# docs-check runs lychee --offline on every PR; this covers what that cannot.
# A scheduled run with broken links opens or updates one tracking issue in this
# repo and closes it once a run is clean. A pull_request run that changes this
# workflow or lychee.toml only reports.

on:
  schedule:
    - cron: "0 6 * * 0" # Sundays 06:00 UTC, after the compat matrix
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/external-links.yml"
      - "lychee.toml"

permissions:
  contents: read

concurrency:
  group: external-links
  cancel-in-progress: false

env:
  REPOS: >-
    anolis
    anolis-protocol
    anolis-provider-bread
    anolis-provider-ezo
    anolis-provider-sim
    anolis-provider-sdk
    anolis-workbench
    anolis-telemetry-export
    anolis-projects
    fluxgraph

jobs:
  links:
    name: External links
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Clone the public repos
        run: |
          set -euo pipefail
          mkdir repos
          for r in $REPOS; do
            git clone --quiet --depth 1 "https://github.com/anolishq/$r.git" "repos/$r"
          done

      - name: Check external links
        id: lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          args: >-
            --config lychee.toml
            --no-progress
            'repos/*/docs/**/*.md'
            'repos/*/README.md'
          output: lychee-report.md
          fail: false
          jobSummary: true

      - name: Open, update or close the tracking issue
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          EXIT_CODE: ${{ steps.lychee.outputs.exit_code }}
          TITLE: "Broken external links in published docs"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$TITLE\" in:title" --json number,title \
            --jq "map(select(.title == \"$TITLE\")) | .[0].number // empty")
          if [ "$EXIT_CODE" = "0" ]; then
            if [ -n "$existing" ]; then
              gh issue close "$existing" --repo "$GITHUB_REPOSITORY" --comment "All external links resolved in $RUN_URL."
            fi
            exit 0
          fi
          { echo "The weekly external link check found broken links ($RUN_URL)."; echo; cat lychee-report.md; } > body.md
          if [ -n "$existing" ]; then
            gh issue edit "$existing" --repo "$GITHUB_REPOSITORY" --body-file body.md
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body-file body.md
          fi
