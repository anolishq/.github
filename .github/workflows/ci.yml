name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  docs-check:
    uses: ./.github/workflows/docs-check.yml
    with:
      docs-path: "profile"
      markdownlint-globs: |
        profile/*.md
        README.md
      skip-vitepress: true # This repo has no real docs to build
      skip-link-check: true # This repo has no local markdown links to check

  test-setup-vcpkg:
    name: Test setup-vcpkg (${{ matrix.os }}, ${{ matrix.triplet }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            triplet: x64-linux
          - os: windows-2022
            triplet: x64-windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup vcpkg
        uses: ./.github/actions/setup-vcpkg
        with:
          vcpkg-commit: "66c0373dc7fca549e5803087b9487edfe3aca0a1"
          triplet: ${{ matrix.triplet }}

      - name: Verify environment
        shell: bash
        run: |
          set -euo pipefail
          echo "VCPKG_ROOT=$VCPKG_ROOT"
          echo "VCPKG_BINARY_SOURCES=$VCPKG_BINARY_SOURCES"
          [[ -n "$VCPKG_ROOT" ]] || { echo "FAIL: VCPKG_ROOT not set"; exit 1; }
          [[ "$VCPKG_BINARY_SOURCES" == *"files,"* ]] || { echo "FAIL: VCPKG_BINARY_SOURCES not configured"; exit 1; }
          "$VCPKG_ROOT/vcpkg" version
          [[ -d "${{ github.workspace }}/.vcpkg-binary-cache" ]] || { echo "FAIL: binary cache dir missing"; exit 1; }
          echo "All checks passed"

      - name: Smoke test — install a small package
        shell: bash
        run: |
          set -euo pipefail
          "$VCPKG_ROOT/vcpkg" install yaml-cpp --triplet ${{ matrix.triplet }}
          # Verify binary was cached
          if ls "${{ github.workspace }}/.vcpkg-binary-cache/"* >/dev/null 2>&1; then
            echo "OK: binary package cached"
            ls -la "${{ github.workspace }}/.vcpkg-binary-cache/"
          else
            echo "FAIL: no binary packages in cache directory"
            exit 1
          fi

  test-setup-vcpkg-derived:
    name: Test setup-vcpkg derived-commit (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            triplet: x64-linux
          - os: windows-2022
            triplet: x64-windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Write a vcpkg-configuration.json fixture in a checkout subdirectory
        shell: bash
        run: |
          set -euo pipefail
          # Real consumers check their repo out under a `path:` subdir, so the
          # config is NOT at the workspace root — the action must discover it.
          mkdir -p consumer-repo
          cat > consumer-repo/vcpkg-configuration.json <<'JSON'
          {
            "default-registry": {
              "kind": "git",
              "repository": "https://github.com/microsoft/vcpkg",
              "baseline": "66c0373dc7fca549e5803087b9487edfe3aca0a1"
            }
          }
          JSON

      - name: Setup vcpkg (derive commit from baseline in subdir, no vcpkg-commit input)
        uses: ./.github/actions/setup-vcpkg
        with:
          triplet: ${{ matrix.triplet }}

      - name: Verify the derived commit matches the baseline
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$VCPKG_ROOT" ]] || { echo "FAIL: VCPKG_ROOT not set"; exit 1; }
          head="$(git -C "$VCPKG_ROOT" rev-parse HEAD)"
          echo "vcpkg HEAD=$head"
          [[ "$head" == "66c0373dc7fca549e5803087b9487edfe3aca0a1" ]] \
            || { echo "FAIL: derived commit ($head) != baseline"; exit 1; }
          echo "OK: vcpkg checked out at the baseline derived from vcpkg-configuration.json"

  test-setup-clang-tools:
    name: Test setup-clang-tools (format + tidy resource dir)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup clang-tools (with clang-tidy)
        uses: ./.github/actions/setup-clang-tools
        with:
          tidy: "true"
      - name: Verify versions + clang-tidy resolves builtin headers with no flags
        shell: bash
        run: |
          set -euo pipefail
          clang-format --version | grep -q "18.1.8" || { echo "FAIL: clang-format not 18.1.8"; exit 1; }
          clang-tidy --version   | grep -q "18.1.8" || { echo "FAIL: clang-tidy not 18.1.8"; exit 1; }
          # The point of the vendored resource dir: clang-tidy must find clang's
          # builtin headers (stddef.h) with NO -resource-dir flag.
          printf '#include <stddef.h>\nsize_t f(void) { return 0; }\n' > /tmp/t.c
          out=$(clang-tidy /tmp/t.c -- -std=c11 2>&1) || true
          echo "$out"
          grep -q "file not found" <<<"$out" && { echo "FAIL: clang-tidy cannot resolve builtin headers (resource dir missing)"; exit 1; }
          # Orchestration scripts on PATH (for `just lint` and the diff-only gate).
          command -v run-clang-tidy  >/dev/null || { echo "FAIL: run-clang-tidy not installed"; exit 1; }
          command -v clang-tidy-diff >/dev/null || { echo "FAIL: clang-tidy-diff not installed"; exit 1; }
          clang-tidy-diff -h >/dev/null 2>&1     || { echo "FAIL: clang-tidy-diff not runnable"; exit 1; }
          echo "OK: clang-format + clang-tidy 18.1.8; resource dir resolves; run-clang-tidy + clang-tidy-diff present"

  ok:
    name: ok
    if: always()
    needs:
      - docs-check
      - test-setup-vcpkg
      - test-setup-vcpkg-derived
      - test-setup-clang-tools
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Evaluate job results
        run: |
          echo "Job results: ${{ toJSON(needs.*.result) }}"
      - name: Fail if any required job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
