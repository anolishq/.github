name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  docs-check:
    uses: ./.github/workflows/docs-check.yml
    with:
      docs-path: "profile"
      markdownlint-globs: |
        profile/*.md
        README.md
      skip-vitepress: true # This repo has no real docs to build
      skip-link-check: true # This repo has no local markdown links to check

  test-scripts:
    name: Test scripts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      # tests/test_valgrind_leak.py runs the workflow's steps under real valgrind.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends valgrind
      - run: pip install jsonschema==4.25.1 pyyaml==6.0.3
      - run: python -m unittest discover -v tests

  test-setup-vcpkg:
    name: Test setup-vcpkg (${{ matrix.os }}, ${{ matrix.triplet }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            triplet: x64-linux
          - os: windows-2022
            triplet: x64-windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup vcpkg
        id: setup
        uses: ./.github/actions/setup-vcpkg
        with:
          vcpkg-commit: "66c0373dc7fca549e5803087b9487edfe3aca0a1"
          r2-endpoint: ${{ vars.VCPKG_R2_ENDPOINT }}
          r2-bucket: ${{ vars.VCPKG_R2_BUCKET }}
          r2-read-access-key-id: ${{ secrets.VCPKG_R2_READ_ACCESS_KEY_ID }}
          r2-read-secret-access-key: ${{ secrets.VCPKG_R2_READ_SECRET_ACCESS_KEY }}
          r2-write-access-key-id: ${{ secrets.VCPKG_R2_WRITE_ACCESS_KEY_ID }}
          r2-write-secret-access-key: ${{ secrets.VCPKG_R2_WRITE_SECRET_ACCESS_KEY }}

      # A pull request from a branch here reads, a push to main writes, and a
      # fork pull request, which gets no secrets, builds without the cache.
      - name: Verify the binary cache mode for this event
        shell: bash
        env:
          MODE: ${{ steps.setup.outputs.binary-cache-mode }}
          EXPECTED: >-
            ${{ github.event_name == 'push' && 'readwrite'
            || (github.event.pull_request.head.repo.full_name == github.repository && 'read' || 'none') }}
        run: |
          set -euo pipefail
          echo "VCPKG_ROOT=$VCPKG_ROOT"
          echo "VCPKG_BINARY_SOURCES=$VCPKG_BINARY_SOURCES"
          "$VCPKG_ROOT/vcpkg" version
          [[ "$MODE" == "$EXPECTED" ]] || { echo "FAIL: mode $MODE, expected $EXPECTED"; exit 1; }
          if [[ "$MODE" != none ]]; then
            [[ "$VCPKG_BINARY_SOURCES" == *"x-aws,s3://"*",$MODE" ]] || { echo "FAIL: no x-aws source in $MODE mode"; exit 1; }
          fi
          echo "OK: binary cache mode $MODE"

      - name: Smoke test — install a small package, then restore it
        shell: bash
        run: |
          set -euo pipefail
          "$VCPKG_ROOT/vcpkg" install yaml-cpp --triplet ${{ matrix.triplet }} --x-install-root=first | tee first.log
          # A second install root: everything comes from a binary cache
          # (the job's own default cache, and R2 when this run reads it).
          "$VCPKG_ROOT/vcpkg" install yaml-cpp --triplet ${{ matrix.triplet }} --x-install-root=second | tee second.log
          grep -q "Restored [1-9][0-9]* package" second.log || { echo "FAIL: the second install restored nothing"; exit 1; }
          if [[ "${{ steps.setup.outputs.binary-cache-mode }}" == readwrite ]]; then
            ! grep -q "upload failed" first.log || { echo "FAIL: an upload to R2 failed"; exit 1; }
          fi

  test-setup-vcpkg-derived:
    name: Test setup-vcpkg derived-commit (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            triplet: x64-linux
          - os: windows-2022
            triplet: x64-windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Write a vcpkg-configuration.json fixture in a checkout subdirectory
        shell: bash
        run: |
          set -euo pipefail
          # Real consumers check their repo out under a `path:` subdir, so the
          # config is NOT at the workspace root — the action must discover it.
          mkdir -p consumer-repo
          cat > consumer-repo/vcpkg-configuration.json <<'JSON'
          {
            "default-registry": {
              "kind": "git",
              "repository": "https://github.com/microsoft/vcpkg",
              "baseline": "66c0373dc7fca549e5803087b9487edfe3aca0a1"
            }
          }
          JSON

      - name: Setup vcpkg (derive commit from baseline in subdir, no vcpkg-commit input)
        uses: ./.github/actions/setup-vcpkg

      - name: Verify the derived commit matches the baseline
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$VCPKG_ROOT" ]] || { echo "FAIL: VCPKG_ROOT not set"; exit 1; }
          head="$(git -C "$VCPKG_ROOT" rev-parse HEAD)"
          echo "vcpkg HEAD=$head"
          [[ "$head" == "66c0373dc7fca549e5803087b9487edfe3aca0a1" ]] \
            || { echo "FAIL: derived commit ($head) != baseline"; exit 1; }
          echo "OK: vcpkg checked out at the baseline derived from vcpkg-configuration.json"

  test-setup-clang-tools:
    name: Test setup-clang-tools (format + tidy resource dir)
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup clang-tools (with clang-tidy)
        uses: ./.github/actions/setup-clang-tools
        with:
          tidy: "true"
      - name: Verify versions + clang-tidy resolves builtin headers with no flags
        shell: bash
        run: |
          set -euo pipefail
          clang-format --version | grep -q "18.1.8" || { echo "FAIL: clang-format not 18.1.8"; exit 1; }
          clang-tidy --version   | grep -q "18.1.8" || { echo "FAIL: clang-tidy not 18.1.8"; exit 1; }
          # The point of the vendored resource dir: clang-tidy must find clang's
          # builtin headers (stddef.h) with NO -resource-dir flag.
          printf '#include <stddef.h>\nsize_t f(void) { return 0; }\n' > /tmp/t.c
          out=$(clang-tidy /tmp/t.c -- -std=c11 2>&1) || true
          echo "$out"
          grep -q "file not found" <<<"$out" && { echo "FAIL: clang-tidy cannot resolve builtin headers (resource dir missing)"; exit 1; }
          # Orchestration scripts on PATH (for `just lint` and the diff-only gate).
          command -v run-clang-tidy  >/dev/null || { echo "FAIL: run-clang-tidy not installed"; exit 1; }
          command -v clang-tidy-diff >/dev/null || { echo "FAIL: clang-tidy-diff not installed"; exit 1; }
          clang-tidy-diff -h >/dev/null 2>&1     || { echo "FAIL: clang-tidy-diff not runnable"; exit 1; }
          echo "OK: clang-format + clang-tidy 18.1.8; resource dir resolves; run-clang-tidy + clang-tidy-diff present"

  ok:
    name: ok
    if: always()
    needs:
      - docs-check
      - test-scripts
      - test-setup-vcpkg
      - test-setup-vcpkg-derived
      - test-setup-clang-tools
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Evaluate job results
        run: |
          echo "Job results: ${{ toJSON(needs.*.result) }}"
      - uses: ./.github/actions/require-needs-passed
        with:
          results: ${{ join(needs.*.result, ' ') }}
